[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name="MSMJax"
authors = [
    {name = "Florian Buchner", email = "florian.buchner@tuwien.ac.at"}
]
description="a Google-JAX-based implementation of the multilevel summation method"
requires-python = ">=3.8"
license = {text = "Apache License 2.0"}
classifiers=[
    "Development Status :: 1 - Planning",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "ase>=3.22",
    "numpy>=1.20",
    "scipy>=1.8",
    "tqdm>=4.63.0",
    "packaging>=23.1",
    "jax",
    "jaxlib",
    "jax-md",
]
dynamic = ["version"]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest", "pytest-datadir"]
doc = ["sphinx", "sphinx-autodoc-typehints", "sphinx-rtd-theme"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.dynamic]
version = {attr = "msmjax.__version__"}
